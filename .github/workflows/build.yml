
name: Build Aurora Visualiser

on:
  push:
    paths:
      - 'Aurora-Visualiser-CrossPlatform.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Aurora project
        run: unzip -o Aurora-Visualiser-CrossPlatform.zip

      - name: Fix Android project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("AuroraVisualiser/app/build.gradle.kts")
          content = gradle.read_text()

          if "sourceCompatibility" not in content:
              content = content.replace(
                  "    compileSdk = 35",
                  """    compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }"""
              )

          if "androidx.core:core-ktx" not in content:
              content += """

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
          }
          """

          gradle.write_text(content)

          source = Path(
              "AuroraVisualiser/app/src/main/java/com/aurora/visualiser/MainActivity.kt"
          )
          code = source.read_text()

          fixes = {
              "sin(x*.12+k*1.3)*h*.12f":
                  "sin(x*.12+k*1.3).toFloat()*h*.12f",

              "cos(x*.055+k)*h*.08f":
                  "cos(x*.055+k).toFloat()*h*.08f",

              "sin(x*.045)*bands[i]*h*.38f":
                  "sin(x*.045).toFloat()*bands[i]*h*.38f",

              "sin(x*.012)*h*.05f":
                  "sin(x*.012).toFloat()*h*.05f",

              "sin(x*.07+k*2)*h*.13f":
                  "sin(x*.07+k*2).toFloat()*h*.13f",

              "cos(x*.025+k)*h*.08f":
                  "cos(x*.025+k).toFloat()*h*.08f"
          }

          for old, new in fixes.items():
              if old not in code:
                  raise SystemExit("Could not find expected code: " + old)
              code = code.replace(old, new)

          source.write_text(code)
          print("Android fixes applied successfully.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p AuroraVisualiser assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Android-APK
          path: AuroraVisualiser/app/build/outputs/apk/debug/*.apk

  windows:
    name: Build Windows app
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Aurora project
        run: Expand-Archive -Path Aurora-Visualiser-CrossPlatform.zip -DestinationPath .
        shell: pwsh

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows app
        run: dotnet publish AuroraVisualiser/WindowsAurora/WindowsAurora.csproj -c Release -r win-x64 --self-contained true -o AuroraWindowsBuild
        shell: pwsh

      - name: Package Windows app
        run: Compress-Archive -Path AuroraWindowsBuild/* -DestinationPath Aurora-Windows.zip
        shell: pwsh

      - name: Save Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Windows
          path: Aurora-Windows.zip
